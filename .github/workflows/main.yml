שערי מטבע לאנדרואיד: איך מקבלים את ה-APK
==========================================

את קובץ ה-APK בונה GitHub בחינם, בשרתים שלו. אין צורך להתקין כלום על המחשב.

שלב 1: חשבון ומאגר (פעם אחת)
------------------------------
1. נכנסים ל-https://github.com ונרשמים (חינם). אם יש כבר חשבון, מתחברים.
2. למעלה מימין לוחצים על "+" ובוחרים "New repository".
3. ב-Repository name כותבים: currency-rates
4. בוחרים Public (כך קל להוריד את ה-APK לטלפון בלי להתחבר).
5. לוחצים על "Create repository".

שלב 2: העלאת הקבצים
---------------------
1. מחלצים את ה-ZIP במחשב (קליק ימני > "חלץ הכל").
2. בדף המאגר החדש לוחצים על הקישור "uploading an existing file".
3. פותחים את התיקייה שחולצה, מסמנים את כל מה שבתוכה (Ctrl+A),
   וגוררים לחלון הדפדפן. חשוב לגרור גם את התיקייה .github
4. למטה לוחצים על "Commit changes".

שלב 3: הבנייה (אוטומטית, 3 עד 6 דקות)
--------------------------------------
1. לוחצים על הלשונית "Actions" למעלה.
   אם מופיע כפתור ירוק "I understand my workflows, go ahead and enable them", לוחצים עליו.
2. רואים ריצה בשם "Build APK" עם עיגול צהוב שמסתובב. מחכים שיהפוך ל-✓ ירוק.
   אם הריצה לא התחילה מעצמה: לוחצים משמאל על "Build APK", אחר כך על "Run workflow" ושוב על "Run workflow".

שלב 4: התקנה בטלפון
--------------------
1. בטלפון פותחים בדפדפן את הכתובת (מחליפים USERNAME בשם המשתמש שלך ב-GitHub):
   https://github.com/USERNAME/currency-rates/releases/latest
2. מורידים את הקובץ CurrencyRates.apk ופותחים אותו.
3. אם הטלפון שואל, מאשרים "התקנה ממקורות לא ידועים" לדפדפן.
   אם Play Protect מזהיר על "אפליקציה לא מוכרת", בוחרים "פרטים נוספים" ואז "התקן בכל זאת".
   זה רגיל לכל אפליקציה שלא הגיעה מחנות Play.
4. בפתיחה הראשונה מאשרים "התראות".

דרך נוספת: ב-Actions נכנסים לריצה המוצלחת ולמטה, תחת Artifacts, מורידים את CurrencyRates-APK.
מגיע ZIP שבתוכו ה-APK. אפשר להעביר אותו לטלפון בוואטסאפ לעצמך, בדרייב או בכבל.

עדכונים בעתיד
--------------
כשמשנים קובץ ומעלים אותו שוב למאגר, GitHub בונה גרסה חדשה לבד.
מתקינים את ה-APK החדש מעל הישן, וההגדרות וההתראות נשמרות.

אם משהו נכשל (X אדום ב-Actions)
--------------------------------
לוחצים על הריצה האדומה ואז על "build", מצלמים את השורות האדומות ושולחים לי.

מה האפליקציה עושה
------------------
* שער יציג (בנק ישראל) ושער רציף ל-7 מטבעות, כמו בתוכנה במחשב.
* התראות: מעל או מתחת לשער, שינוי יומי %, ופער בין היציג לרציף %.
  אפשר לבחור לבדוק לפי היציג, לפי הרציף או לפי כל אחד מהם.
* בדיקה ברקע כל 15 דקות (אפשר לשנות), גם כשהאפליקציה סגורה.
  ההתראה מגיעה לשורת ההתראות עם צליל.
* יומן התראות ושיתוף שלו כ-CSV.
* כשהאפליקציה פתוחה, היא מתרעננת כל 60 שניות.

